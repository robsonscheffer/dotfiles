<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- TITLE --></title>
    <script>
      (function () {
        var THEMES = ["mate", "mate-light"];
        var t = localStorage.getItem("mate-theme");
        if (THEMES.indexOf(t) === -1)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "mate"
            : "mate-light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <!-- GENERATOR -->
    <!-- Fonts inlined as base64 in the stylesheet below — see bin/fetch-fonts.py. -->
    <!-- MAIN_CSS -->
    <style>
      .walk-index {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 2rem 4rem;
      }
      .walk-index table {
        width: 100%;
        border-collapse: collapse;
      }
      .walk-index th {
        text-align: left;
        font-family: var(--mate-font-body);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mate-frame-muted);
        padding: 0 0.75rem 0.6rem;
        border-bottom: 1px solid var(--mate-frame-line);
      }
      .walk-index td {
        padding: 0.7rem 0.75rem;
        font-size: 14px;
        border-bottom: 1px solid var(--mate-frame-line);
        vertical-align: middle;
      }
      .walk-index tr:hover td {
        background: var(--mate-frame-raised);
      }
      .walk-index .pr,
      .walk-index .date {
        font-family: var(--mate-font-mono);
        color: var(--mate-frame-dim);
        white-space: nowrap;
      }
      .walk-index a {
        color: var(--mate-frame-text);
        text-decoration: none;
      }
      .walk-index a:hover {
        color: var(--color-accent);
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <header
      style="
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.7rem 2rem;
        background: var(--mate-frame-bg);
        border-bottom: 1px solid var(--mate-frame-line);
      "
    >
      <span
        style="
          font-family: var(--mate-font-display);
          font-size: 15px;
          font-weight: 600;
        "
        >walk-<em style="color: var(--color-accent)">review</em></span
      >
      <button
        onclick="toggleTheme()"
        title="Toggle theme"
        style="
          padding: 4px 8px;
          border-radius: 4px;
          border: 1px solid var(--mate-frame-line);
          color: var(--mate-frame-muted);
        "
      >
        <span id="theme-icon">&#9789;</span>
      </button>
    </header>

    <main class="walk-index">
      <h1
        style="
          font-family: var(--mate-font-display);
          font-size: 1.75rem;
          font-weight: 600;
          margin-bottom: 0.5rem;
        "
      >
        <!-- TITLE -->
      </h1>
      <p
        style="
          font-size: 14px;
          color: var(--mate-frame-muted);
          margin-bottom: 2rem;
        "
      >
        Every PR walk you run appears here. Open a walk to review inline —
        GitHub only for submitting.
      </p>

      <table>
        <thead>
          <tr>
            <th>PR</th>
            <th>Title</th>
            <th>Author</th>
            <th>Date</th>
            <th>Tags</th>
            <th>Verdict</th>
          </tr>
        </thead>
        <tbody id="walks-tbody">
          <!-- CONTENT -->
        </tbody>
      </table>
    </main>

    <footer
      style="
        padding: 2rem;
        text-align: center;
        font-size: 12px;
        color: var(--mate-frame-dim);
      "
    >
      <!-- DATE -->
    </footer>

    <script>
      function toggleTheme() {
        var next =
          document.documentElement.getAttribute("data-theme") === "mate"
            ? "mate-light"
            : "mate";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("mate-theme", next);
        document.getElementById("theme-icon").innerHTML =
          next === "mate" ? "&#9789;" : "&#9788;";
      }
      document.getElementById("theme-icon").innerHTML =
        document.documentElement.getAttribute("data-theme") === "mate"
          ? "&#9789;"
          : "&#9788;";
    </script>
  </body>
</html>
