<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- TITLE --></title>
    <script>
      (function () {
        var t = localStorage.getItem("mate-theme");
        if (!t)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "mate"
            : "mate-light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght;500;600;700&family=Geist+Mono:wght;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- MAIN_CSS -->
  </head>
  <body>
    <div class="grain"></div>

    <header
      style="
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 40px;
        background: var(--mate-frame-nav);
        border-bottom: 1px solid var(--mate-frame-border);
      "
    >
      <a
        href="<!-- BACK_LINK -->"
        title="Back to all walks"
        style="
          font-family: var(--mate-font-display);
          font-size: 17px;
          color: var(--mate-frame-text);
          white-space: nowrap;
          flex-shrink: 0;
          text-decoration: none;
        "
        >walk-<em style="color: var(--mate-primary); font-weight: 400"
          >review</em
        ></a
      >
      <span style="flex: 1"></span>
      <button
        id="theme-toggle"
        onclick="toggleTheme()"
        aria-label="Toggle light/dark theme"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 28px;
          height: 28px;
          background: var(--mate-frame-sidebar);
          border: 1px solid var(--mate-frame-border);
          border-radius: 6px;
          cursor: pointer;
          color: var(--mate-frame-muted);
          font-size: 14px;
          line-height: 1;
          flex-shrink: 0;
        "
      >
        <span id="theme-icon"></span>
      </button>
    </header>

    <main style="padding: 32px 40px 80px">
      <!-- CONTENT -->

      <footer
        style="
          margin-top: 80px;
          border-top: 1px solid var(--mate-frame-border);
          padding-top: 16px;
          font-size: 13px;
          color: var(--mate-frame-dim);
          font-family: var(--mate-font-body);
        "
      >
        Generated
        <!-- DATE -->
        · rs-walk skill
      </footer>
    </main>

    <script>
      function updateThemeIcon() {
        var current =
          document.documentElement.getAttribute("data-theme") || "mate";
        var icon = document.getElementById("theme-icon");
        // Icon shows the theme a click switches TO, not the active one.
        if (icon) icon.textContent = current === "mate" ? "☀" : "☾";
      }
      function toggleTheme() {
        var current =
          document.documentElement.getAttribute("data-theme") || "mate";
        var next = current === "mate" ? "mate-light" : "mate";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("mate-theme", next);
        updateThemeIcon();
      }
      updateThemeIcon();
    </script>
  </body>
</html>
