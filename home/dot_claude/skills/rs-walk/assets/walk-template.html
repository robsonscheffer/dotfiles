<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="<!-- DESCRIPTION -->" />
    <title><!-- TITLE --></title>
    <script>
      (function () {
        var THEMES = ["mate", "mate-light"];
        var t = localStorage.getItem("mate-theme");
        if (THEMES.indexOf(t) === -1)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "mate"
            : "mate-light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <!-- GENERATOR -->
    <!-- Fonts are inlined as base64 in the stylesheet below — a walk must
         render identically offline. See bin/fetch-fonts.py. -->
    <!-- MAIN_CSS -->
  </head>
  <body>
    <div class="grain"></div>

    <header class="walk-header">
      <a href="<!-- BACK_LINK -->" title="Back to all walks" class="walk-brand"
        >walk-<em>review</em></a
      >
      <span class="walk-header-spacer"></span>
      <span class="walk-readtime" title="Estimated time to read this walk"
        ><!-- READ_TIME -->
        read</span
      >
      <button
        id="theme-toggle"
        onclick="toggleTheme()"
        aria-label="Toggle light/dark theme"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 28px;
          height: 28px;
          background: var(--mate-frame-sidebar);
          border: 1px solid var(--mate-frame-border);
          border-radius: 6px;
          cursor: pointer;
          color: var(--mate-frame-muted);
          font-size: 14px;
          line-height: 1;
          flex-shrink: 0;
        "
      >
        <span id="theme-icon"></span>
      </button>
      <!-- Sits on the header's bottom edge, which also seals the seam the
           section headers stick to. -->
      <div class="walk-progress" aria-hidden="true">
        <div class="walk-progress-fill" id="walk-progress-fill"></div>
      </div>
    </header>

    <main style="padding: 32px 40px 80px">
      <!-- CONTENT -->

      <footer
        style="
          margin-top: 80px;
          border-top: 1px solid var(--mate-frame-border);
          padding-top: 16px;
          font-size: 13px;
          color: var(--mate-frame-dim);
          font-family: var(--mate-font-body);
        "
      >
        Generated
        <!-- DATE -->
        · rs-walk skill
      </footer>
    </main>

    <script>
      function updateThemeIcon() {
        var current =
          document.documentElement.getAttribute("data-theme") || "mate";
        var icon = document.getElementById("theme-icon");
        // Icon shows the theme a click switches TO, not the active one.
        if (icon) icon.textContent = current === "mate" ? "☀" : "☾";
      }
      function toggleTheme() {
        var current =
          document.documentElement.getAttribute("data-theme") || "mate";
        var next = current === "mate" ? "mate-light" : "mate";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("mate-theme", next);
        updateThemeIcon();
      }
      updateThemeIcon();

      // Scroll progress. Purely a duplicate of the scrollbar, so aria-hidden —
      // but the scrollbar is easy to miss on a document this long.
      (function () {
        var fill = document.getElementById("walk-progress-fill");
        if (!fill) return;
        var queued = false;
        function paint() {
          queued = false;
          var doc = document.documentElement;
          var max = doc.scrollHeight - doc.clientHeight;
          var pct = max > 0 ? (doc.scrollTop / max) * 100 : 0;
          fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
        }
        function onScroll() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(paint);
        }
        addEventListener("scroll", onScroll, { passive: true });
        // Folding a section changes scrollHeight, so recompute on resize too.
        addEventListener("resize", onScroll, { passive: true });
        document.addEventListener("toggle", onScroll, true);
        paint();
      })();
    </script>
  </body>
</html>
