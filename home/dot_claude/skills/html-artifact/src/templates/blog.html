<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- TITLE --></title>
    <script>
      (function () {
        var t = localStorage.getItem("mate-theme");
        if (!t)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "mate"
            : "mate-light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/main.css" />
  </head>
  <body>
    <div class="grain"></div>
    <div class="reading-progress" id="reading-progress"></div>

    <header
      class="sticky top-0 z-20 h-12 flex items-center px-4 md:px-6 gap-4"
      style="
        background: var(--mate-frame-nav);
        border-bottom: 1px solid var(--mate-frame-border);
      "
    >
      <div class="flex-1 flex items-center gap-6 min-w-0">
        <span
          style="
            font-family: var(--mate-font-display);
            font-size: 18px;
            color: var(--mate-frame-text);
            white-space: nowrap;
          "
          >mate-<em style="color: var(--mate-primary); font-weight: 400"
            >ds</em
          ></span
        >
        <nav class="hidden md:flex items-center gap-4">
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="../showcase.html"
            >Components</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="report.html"
            >Reports</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="spec.html"
            >Specs</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="prototype.html"
            >Prototypes</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-text)"
            href="blog.html"
            >Blog</a
          >
        </nav>
      </div>
      <select
        id="theme-switcher"
        onchange="setTheme(this.value)"
        style="
          font-family: var(--mate-font-body);
          font-size: 12px;
          color: var(--mate-frame-muted);
          background: var(--mate-frame-sidebar);
          border: 1px solid var(--mate-frame-border);
          border-radius: 6px;
          padding: 3px 8px;
          cursor: pointer;
          outline: none;
        "
      >
        <option value="mate">mate</option>
        <option value="mate-light">mate-light</option>
        <option value="gruvbox">gruvbox</option>
        <option value="gruvbox-light">gruvbox-light</option>
      </select>
    </header>

    <div class="blog-layout with-toc">
      <article>
        <nav aria-label="Breadcrumb" style="margin-bottom: 28px">
          <ol class="breadcrumb">
            <li><a href="#">Artifacts</a></li>
            <li><a href="#">Blog</a></li>
            <li aria-current="page"><!-- TITLE --></li>
          </ol>
        </nav>

        <div class="blog-header">
          <h1><!-- TITLE --></h1>
          <div class="blog-meta">
            <span><!-- CATEGORY --></span>
            <span class="sep">·</span>
            <span><!-- DATE --></span>
            <span class="sep">·</span>
            <span
              ><!-- READ TIME -->
              min read</span
            >
          </div>
        </div>

        <div class="author-card">
          <div class="author-avatar"><!-- AUTHOR INITIAL --></div>
          <div>
            <div class="author-name"><!-- AUTHOR NAME --></div>
            <div class="author-bio"><!-- AUTHOR ROLE --></div>
          </div>
        </div>

        <!-- HERO IMAGE (optional): uncomment and fill src/alt/caption
        <figure class="blog-hero">
          <img src="IMAGE_URL" alt="IMAGE_ALT" />
          <figcaption>CAPTION</figcaption>
        </figure>
        -->

        <div class="blog-prose" id="post-content">
          <!-- CONTENT -->
        </div>

        <div class="blog-pullquote">
          <!-- PULL QUOTE -->
          <cite><!-- ATTRIBUTION --></cite>
        </div>

        <div class="tag-list">
          <!-- TAGS: add/remove tag-pill elements as needed -->
          <a href="#" class="tag-pill"><!-- TAG --></a>
        </div>

        <div class="related-section">
          <div class="related-section-title">Related</div>
          <div class="related-grid">
            <!-- RELATED CARDS: copy this pattern for each related post -->
            <a href="#" class="related-card">
              <div class="rc-tag"><!-- CATEGORY --></div>
              <div class="rc-title"><!-- POST TITLE --></div>
              <div class="rc-meta">
                <!-- DATE -->
                ·
                <!-- READ TIME -->
                min
              </div>
            </a>
            <a href="#" class="related-card">
              <div class="rc-tag"><!-- CATEGORY --></div>
              <div class="rc-title"><!-- POST TITLE --></div>
              <div class="rc-meta">
                <!-- DATE -->
                ·
                <!-- READ TIME -->
                min
              </div>
            </a>
            <a href="#" class="related-card">
              <div class="rc-tag"><!-- CATEGORY --></div>
              <div class="rc-title"><!-- POST TITLE --></div>
              <div class="rc-meta">
                <!-- DATE -->
                ·
                <!-- READ TIME -->
                min
              </div>
            </a>
          </div>
        </div>

        <footer
          style="
            margin-top: 56px;
            border-top: 1px solid var(--mate-frame-border);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--mate-frame-dim);
            font-family: var(--mate-font-body);
          "
        >
          <span
            >Published
            <!-- DATE -->
            · html-artifact skill</span
          >
          <span><!-- FOOTER LINK --></span>
        </footer>
      </article>

      <aside>
        <nav class="blog-toc" id="toc" aria-label="Table of contents">
          <div class="blog-toc-title">On this page</div>
          <!-- TOC LINKS: one <a href="#section-id"> per h2, add class="h3" for h3 -->
        </nav>
      </aside>
    </div>

    <script>
      function setTheme(v) {
        document.documentElement.setAttribute("data-theme", v);
        localStorage.setItem("mate-theme", v);
        var s = document.getElementById("theme-switcher");
        if (s) s.value = v;
      }
      var sel = document.getElementById("theme-switcher");
      if (sel)
        sel.value =
          document.documentElement.getAttribute("data-theme") || "mate";

      (function () {
        var bar = document.getElementById("reading-progress");
        if (!bar) return;
        function update() {
          var el = document.documentElement;
          var scrolled = el.scrollTop || document.body.scrollTop;
          var total = el.scrollHeight - el.clientHeight;
          bar.style.width = total > 0 ? (scrolled / total) * 100 + "%" : "0%";
        }
        window.addEventListener("scroll", update, { passive: true });
        update();
      })();

      (function () {
        var toc = document.getElementById("toc");
        if (!toc) return;
        var links = toc.querySelectorAll("a[href^='#']");
        if (!links.length) return;
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                links.forEach(function (l) {
                  l.classList.remove("active");
                });
                var match = toc.querySelector(
                  "a[href='#" + entry.target.id + "']",
                );
                if (match) match.classList.add("active");
              }
            });
          },
          { rootMargin: "-20% 0px -70% 0px" },
        );
        links.forEach(function (l) {
          var id = l.getAttribute("href").slice(1);
          var el = document.getElementById(id);
          if (el) observer.observe(el);
        });
      })();
    </script>
  </body>
</html>
