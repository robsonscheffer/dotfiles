<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- TITLE --></title>
    <script>
      (function () {
        var t = localStorage.getItem("mate-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/main.css" />
  </head>
  <body>
    <div class="grain"></div>
    <header
      class="sticky top-0 z-20 h-12 flex items-center px-4 md:px-6 gap-4"
      style="
        background: var(--mate-frame-nav);
        border-bottom: 1px solid var(--mate-frame-border);
      "
    >
      <div class="flex-1 flex items-center gap-6 min-w-0">
        <span
          style="
            font-family: var(--mate-font-display);
            font-size: 18px;
            color: var(--mate-frame-text);
            white-space: nowrap;
          "
          >mate-<em style="color: var(--mate-primary); font-weight: 400"
            >ds</em
          ></span
        >
        <nav class="hidden md:flex items-center gap-4">
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="../showcase.html"
            >Components</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="report.html"
            >Reports</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="spec.html"
            >Specs</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="prototype.html"
            >Prototypes</a
          >
        </nav>
      </div>
      <select
        id="theme-switcher"
        onchange="setTheme(this.value)"
        style="
          font-family: var(--mate-font-body);
          font-size: 12px;
          color: var(--mate-frame-muted);
          background: var(--mate-frame-sidebar);
          border: 1px solid var(--mate-frame-border);
          border-radius: 6px;
          padding: 3px 8px;
          cursor: pointer;
          outline: none;
        "
      >
        <option value="mate">mate</option>
        <option value="mate-light">mate-light</option>
        <option value="gruvbox">gruvbox</option>
        <option value="gruvbox-light">gruvbox-light</option>
      </select>
    </header>

    <main style="max-width: 900px; margin: 0 auto; padding: 40px 40px 80px">
      <div
        class="artifact-header"
        style="
          border-bottom: 1px solid var(--mate-frame-border);
          padding-bottom: 24px;
          margin-bottom: 32px;
          background: transparent;
        "
      >
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li><a href="#">Artifacts</a></li>
            <li><a href="#">Dashboards</a></li>
            <li aria-current="page"><!-- TITLE --></li>
          </ol>
        </nav>
        <h1
          style="
            font-family: var(--mate-font-display);
            font-size: 44px;
            font-weight: 600;
            color: var(--mate-frame-text);
            letter-spacing: -0.015em;
            margin: 14px 0 10px;
            line-height: 1.1;
          "
        >
          <!-- TITLE -->
        </h1>
        <div class="meta">
          <span class="badge badge-ghost">dashboard</span>
          <span
            style="
              color: var(--mate-frame-muted);
              font-size: 13px;
              font-family: var(--mate-font-body);
            "
            ><!-- DATE --></span
          >
          <!-- ADDITIONAL META BADGES -->
        </div>
      </div>

      <!-- CONTENT: use .stats + .stat for metric tiles, table.artifact-table for data tables -->
      <!-- DaisyUI .stats grid: <div class="stats shadow"> <div class="stat"> ... </div> </div> -->

      <footer
        style="
          margin-top: 80px;
          border-top: 1px solid var(--mate-frame-border);
          padding-top: 16px;
          display: flex;
          justify-content: space-between;
          font-size: 12px;
          color: var(--mate-frame-dim);
          font-family: var(--mate-font-body);
          background: transparent;
        "
      >
        <span
          >Generated
          <!-- DATE -->
          · html-artifact skill</span
        >
        <span><!-- FOOTER LINK --></span>
      </footer>
    </main>
    <script>
      function setTheme(v) {
        document.documentElement.setAttribute("data-theme", v);
        localStorage.setItem("mate-theme", v);
        var s = document.getElementById("theme-switcher");
        if (s) s.value = v;
      }
      var sel = document.getElementById("theme-switcher");
      if (sel)
        sel.value =
          document.documentElement.getAttribute("data-theme") || "mate";
    </script>
  </body>
</html>
