<!doctype html>
<html lang="en" data-theme="mate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- TITLE --></title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/main.css" />
  </head>
  <body>
    <header
      class="sticky top-0 z-20 h-12 flex items-center px-6 bg-[var(--mate-frame-nav)] border-b border-[var(--mate-frame-border)]"
    >
      <div class="flex-1 flex items-center gap-6">
        <div
          style="
            font-family: var(--mate-font-display);
            font-size: 18px;
            color: var(--mate-frame-text);
          "
        >
          mate-<em style="color: var(--mate-primary); font-weight: 400">ds</em>
        </div>
        <div class="hidden md:flex items-center gap-4">
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="../showcase.html"
            >Components</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="report.html"
            >Reports</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-text)"
            href="spec.html"
            >Specs</a
          >
          <a
            class="text-sm"
            style="color: var(--mate-frame-muted)"
            href="prototype.html"
            >Prototypes</a
          >
        </div>
      </div>
    </header>

    <main style="max-width: 900px; margin: 0 auto; padding: 40px 40px 80px">
      <div
        class="artifact-header"
        style="
          border-bottom: 1px solid var(--mate-frame-border);
          padding-bottom: 24px;
          margin-bottom: 32px;
          background: transparent;
        "
      >
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li><a href="#">Artifacts</a></li>
            <li><a href="#">Specs</a></li>
            <li aria-current="page"><!-- TITLE --></li>
          </ol>
        </nav>
        <h1
          style="
            font-family: var(--mate-font-display);
            font-size: 44px;
            font-weight: 600;
            color: var(--mate-frame-text);
            letter-spacing: -0.015em;
            margin: 14px 0 10px;
            line-height: 1.1;
          "
        >
          <!-- TITLE -->
        </h1>
        <div class="meta">
          <span class="badge badge-building">spec</span>
          <span
            style="
              color: var(--mate-frame-muted);
              font-size: 13px;
              font-family: var(--mate-font-body);
            "
            ><!-- DATE --></span
          >
          <!-- ADDITIONAL META BADGES -->
        </div>
      </div>

      <!-- CONTENT: use .spec-layout for sections with a right rail, or plain divs for prose sections -->
      <!-- Example with rail:
  <div class="spec-layout">
    <div class="spec-body" style="color:var(--mate-frame-text);">
      <h2 style="font-family:var(--mate-font-display);font-size:28px;font-weight:600;margin:0 0 12px;">Section Title</h2>
      <p style="color:var(--mate-frame-muted);font-size:14px;line-height:1.7;">...</p>
      <div class="spec-decision"><strong>Decision —</strong> ...</div>
    </div>
    <aside class="spec-rail">
      <div class="spec-rail-row"><div class="spec-rail-label">Status</div><div class="spec-rail-value"><span class="badge badge-building">building</span></div></div>
      <div class="spec-rail-row"><div class="spec-rail-label">Ticket</div><div class="spec-rail-value" style="font-family:var(--mate-font-mono);font-size:12px;">TICKET-XXXXX</div></div>
    </aside>
  </div>
  -->

      <footer
        style="
          margin-top: 80px;
          border-top: 1px solid var(--mate-frame-border);
          padding-top: 16px;
          display: flex;
          justify-content: space-between;
          font-size: 12px;
          color: var(--mate-frame-dim);
          font-family: var(--mate-font-body);
          background: transparent;
        "
      >
        <span
          >Generated
          <!-- DATE -->
          · html-artifact skill</span
        >
        <span><!-- FOOTER LINK --></span>
      </footer>
    </main>
  </body>
</html>
