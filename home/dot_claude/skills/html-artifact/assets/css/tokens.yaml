# mate design system — token reference
# Default theme: mate (dark). Two themes available: mate, mate-light.
# All values are CSS custom properties on [data-theme]. Reference as var(--mate-*) in inline styles.
#
# Dark theme second pass: neutral/frame chroma dropped from ~0.016-0.018 to
# ~0.005-0.008 so surfaces read as clean graphite instead of muddy brown, and
# accent lightness/chroma raised so colors pop against the dark background
# instead of desaturating into it. See tokens.css for the full rationale.

palette:
  primary:
    {
      value: "oklch(64% 0.19 38)",
      hex: "#e75623",
      name: "Terracotta",
      usage: "Brand, CTAs, active states",
    }
  secondary:
    {
      value: "oklch(64% 0.12 58)",
      hex: "#c2783a",
      name: "Warm Umber",
      usage: "Secondary actions, accents",
    }
  success:
    {
      value: "oklch(68% 0.15 155)",
      hex: "#32b36e",
      name: "Sage Green",
      usage: "Success states, done badges",
    }
  warning:
    {
      value: "oklch(78% 0.16 82)",
      hex: "#eaab05",
      name: "Amber",
      usage: "Warning states, in-progress",
    }
  error:
    {
      value: "oklch(65% 0.21 22)",
      hex: "#f54651",
      name: "Coral Red",
      usage: "Error states, destructive",
    }
  info:
    {
      value: "oklch(68% 0.14 245)",
      hex: "#3f9fe8",
      name: "Steel Blue",
      usage: "Info states, minor severity",
    }
  erva:
    {
      value: "oklch(68% 0.15 155)",
      hex: "#32b36e",
      name: "Chimarrão",
      usage: "Alternate success, erva mate",
    }

frame:
  bg:
    {
      value: "oklch(15% 0.006 55)",
      hex: "#0d0b09",
      name: "Graphite",
      usage: "Page background",
    }
  sidebar:
    {
      value: "oklch(21% 0.006 55)",
      hex: "#1b1816",
      name: "Graphite Sidebar",
      usage: "Sidebar background",
    }
  nav:
    {
      value: "oklch(10% 0.005 55)",
      hex: "#040302",
      name: "Graphite Nav",
      usage: "Top nav background",
    }
  border:
    {
      value: "oklch(100% 0 0 / 0.1)",
      hex: "rgba(255,255,255,0.1)",
      usage: "Dividers on dark surfaces",
    }
  text:
    {
      value: "oklch(93% 0.008 75)",
      hex: "#ebe7e2",
      name: "Warm White",
      usage: "Primary text on dark",
    }
  muted:
    {
      value: "oklch(66% 0.014 65)",
      hex: "#989189",
      name: "Warm Gray",
      usage: "Secondary text, labels",
    }
  dim:
    {
      value: "oklch(57% 0.013 60)",
      hex: "#7d7670",
      name: "Dark Tan",
      usage: "Tertiary text, icons",
    }

typography:
  display:
    {
      family: "Cormorant Garamond",
      weights: [400, 600],
      usage: "Headings, artifact titles, stat values",
    }
  body:
    {
      family: "Inter",
      weights: [300, 400, 500, 600],
      usage: "UI text, labels, descriptions",
    }
  mono:
    {
      family: "JetBrains Mono",
      weights: [400, 500],
      usage: "Code, hex values, numbers, monospaced data",
    }

spacing:
  xs: "4px"
  s: "8px"
  m: "16px"
  l: "24px"
  xl: "40px"

themes:
  - id: mate
    label: "mate (dark)"
    color-scheme: dark
    base-100: "oklch(15% 0.006 55)"
  - id: mate-light
    label: "mate-light"
    color-scheme: light
    base-100: "oklch(98% 0.008 75)"
