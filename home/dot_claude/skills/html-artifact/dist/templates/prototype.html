          background-color: var(--mate-frame-nav);
        }
        .px-6 {
          padding-inline: calc(var(--spacing) * 6);
        }
        .text-sm {
          font-size: var(--text-sm);
          line-height: var(--tw-leading, var(--text-sm--line-height));
        }
        .prose
          :where(a.btn:not(.btn-link)):not(
            :where([class~="not-prose"], [class~="not-prose"] *)
          ) {
          text-decoration-line: none;
        }
        .shadow {
          --tw-shadow:
            0 1px 3px 0 var(--tw-shadow-color, #0000001a),
            0 1px 2px -1px var(--tw-shadow-color, #0000001a);
          box-shadow:
            var(--tw-inset-shadow), var(--tw-inset-ring-shadow),
            var(--tw-ring-offset-shadow), var(--tw-ring-shadow),
            var(--tw-shadow);
        }
        @media (min-width: 48rem) {
          .md\:flex {
            display: flex;
          }
        }
      }
      [data-theme="mate"] {
        --color-primary: oklch(66.2805% 0.129825 43.149);
        --color-secondary: oklch(70.4384% 0.0811 63.3617);
        --color-success: oklch(71.4151% 0.113775 139.111);
        --color-warning: oklch(80.6102% 0.136459 84.8865);
        --color-error: oklch(62.945% 0.177594 23.7237);
        --color-info: oklch(67.3688% 0.0632274 225.279);
        --color-base-100: oklch(19.7123% 0.0124681 84.5075);
        --color-base-200: oklch(22.8602% 0.014354 81.5902);
        --color-base-300: oklch(21.0997% 0.0161978 84.4177);
        --color-base-content: oklch(90.9738% 0.0183401 78.2365);
      }
      :root {
        --mate-primary: #d4764e;
        --mate-secondary: #c4956a;
        --mate-success: #7db46e;
        --mate-warning: #e8b84a;
        --mate-error: #e05252;
        --mate-info: #6b9fb4;
        --mate-erva: #5a9a4e;
        --mate-frame-bg: #18150f;
        --mate-frame-sidebar: #201c15;
        --mate-frame-nav: #1c1810;
        --mate-frame-border: #ffffff12;
        --mate-frame-text: #e8e0d4;
        --mate-frame-muted: #a0927e;
        --mate-frame-dim: #857363;
        --mate-font-display: "Cormorant Garamond", Georgia, serif;
        --mate-font-body: "Jost", system-ui, sans-serif;
        --mate-font-mono: "DM Mono", monospace;
      }
      body {
        font-family: var(--mate-font-body);
        background: var(--mate-frame-bg);
        -webkit-font-smoothing: antialiased;
      }
      body:after {
        content: "";
        pointer-events: none;
        z-index: 9998;
        opacity: 0.028;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      .sidebar-link {
        font-family: var(--mate-font-body);
        color: var(--mate-frame-muted);
        border-left: 2px solid #0000;
        align-items: center;
        gap: 8px;
        padding: 6px 20px;
        font-size: 14px;
        font-weight: 400;
        text-decoration: none;
        transition: all 0.15s;
        display: flex;
      }
      .sidebar-link .num {
        font-family: var(--mate-font-mono);
        color: var(--mate-frame-dim);
        min-width: 16px;
        font-size: 10px;
      }
      .sidebar-link:hover {
        color: var(--mate-frame-text);
        background: #ffffff0a;
      }
      .sidebar-link.active {
        border-left-color: var(--mate-primary);
        color: var(--mate-frame-text);
        background: #d4764e14;
        font-weight: 500;
      }
      .sidebar-link.active .num {
        color: var(--mate-primary);
      }
      .artifact-header {
        background: var(--mate-frame-bg);
        border-bottom: 1px solid var(--mate-frame-border);
        padding: 32px 40px 24px;
      }
      .breadcrumb {
        font-family: var(--mate-font-body);
        color: var(--mate-frame-muted);
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
        padding: 0;
        font-size: 13px;
        list-style: none;
        display: flex;
      }
      .breadcrumb li {
        align-items: center;
        gap: 6px;
        display: flex;
      }
      .breadcrumb li + li:before {
        content: "/";
        color: var(--mate-frame-dim);
      }
      .breadcrumb a {
        color: var(--mate-frame-muted);
      }
      .breadcrumb li[aria-current="page"] {
        color: var(--mate-frame-text);
      }
      .artifact-header h1 {
        font-family: var(--mate-font-display);
        color: var(--mate-frame-text);
        letter-spacing: -0.015em;
        margin: 14px 0 10px;
        font-size: 44px;
        font-weight: 600;
        line-height: 1.1;
      }
      .artifact-header h1 em {
        color: var(--mate-primary);
        font-style: italic;
      }
      .artifact-header .meta {
        font-family: var(--mate-font-body);
        color: var(--mate-frame-muted);
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        font-size: 13px;
        display: flex;
      }
      .page-content {
        padding-bottom: 80px;
      }
      .ds-section {
        border-top: 1px solid var(--mate-frame-border);
        opacity: 0;
        padding: 40px 40px 0;
        transition:
          opacity 0.5s,
          transform 0.5s;
        transform: translateY(16px);
      }
      .ds-section:first-child {
        border-top: none;
      }
      .ds-section.visible {
        opacity: 1;
        transform: none;
      }
      .section-header {
        flex-wrap: wrap;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 6px;
        display: flex;
      }
      .section-header h2 {
        font-family: var(--mate-font-display);
        color: var(--mate-frame-text);
        letter-spacing: -0.01em;
        margin: 0;
        font-size: 32px;
        font-weight: 600;
      }
      .section-tag {
        font-family: var(--mate-font-mono);
        color: var(--mate-frame-dim);
        background: #ffffff0f;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 12px;
      }
      .section-desc {
        color: var(--mate-frame-muted);
        max-width: 64ch;
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .preview-card {
        color: #111827;
        background: #fff;
        border-radius: 10px;
        margin-top: 16px;
        padding: 24px;
        box-shadow: 0 2px 16px #0006;
      }
      .artifact-footer {
        background: var(--mate-frame-nav);
        border-top: 1px solid var(--mate-frame-border);
        font-family: var(--mate-font-body);
        color: var(--mate-frame-dim);
        justify-content: space-between;
        align-items: center;
        padding: 16px 40px;
        font-size: 12px;
        display: flex;
      }
      .artifact-footer a {
        color: var(--mate-frame-muted);
        text-decoration: none;
      }
      .artifact-footer a:hover {
        color: var(--mate-frame-text);
      }
      .sev {
        font-size: 11px;
        font-weight: 700;
        font-family: var(--mate-font-mono);
        border: 1px solid;
        border-radius: 4px;
        padding: 2px 10px;
        display: inline-flex;
      }
      .sev-critical {
        color: var(--mate-error);
        background: #fef2f2;
        border-color: #fca5a5;
      }
      .sev-major {
        color: #c47a0a;
        background: #fffbeb;
        border-color: #fcd34d;
      }
      .sev-minor {
        color: var(--mate-info);
        background: #eff6ff;
        border-color: #93c5fd;
      }
      .sev-nit {
        color: #6b7280;
        background: #f9fafb;
        border-color: #d1d5db;
      }
      .badge-open {
        color: #1d4ed8 !important;
        background: #dbeafe !important;
        border-color: #dbeafe !important;
      }
      .badge-ready {
        color: #3730a3 !important;
        background: #e0e7ff !important;
        border-color: #e0e7ff !important;
      }
      .badge-building {
        color: #92400e !important;
        background: #fef3c7 !important;
        border-color: #fef3c7 !important;
      }
      .badge-done {
        color: #065f46 !important;
        background: #d1fae5 !important;
        border-color: #d1fae5 !important;
      }
      .badge-dropped {
        color: #6b7280 !important;
        background: #f3f4f6 !important;
        border-color: #f3f4f6 !important;
      }
      .stat-delta {
        font-size: 12px;
        font-family: var(--mate-font-body);
        margin-top: 4px;
      }
      .delta-up {
        color: var(--mate-success);
      }
      .delta-down {
        color: var(--mate-error);
      }
      .diff-block {
        font-family: var(--mate-font-mono);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        overflow: hidden;
      }
      .diff-file-header {
        color: #374151;
        background: #f3f4f6;
        border-bottom: 1px solid #e5e7eb;
        justify-content: space-between;
        align-items: center;
        padding: 8px 16px;
        font-size: 13px;
        display: flex;
      }
      .diff-hunk-header {
        color: #1d4ed8;
        background: #eff6ff;
        border-bottom: 1px solid #dbeafe;
        padding: 4px 16px;
        font-size: 11px;
      }
      .diff-line {
        display: flex;
      }
      .diff-line-num {
        text-align: right;
        color: #9ca3af;
        -webkit-user-select: none;
        user-select: none;
        border-right: 1px solid #e5e7eb;
        flex-shrink: 0;
        width: 48px;
        padding: 2px 8px;
      }
      .diff-prefix {
        text-align: center;
        flex-shrink: 0;
        width: 20px;
        padding: 2px 0;
      }
      .diff-line-code {
        white-space: pre;
        color: #374151;
        flex: 1;
        padding: 2px 8px;
      }
      .diff-line.added {
        background: #f0fdf4;
      }
      .diff-line.added .diff-prefix {
        color: #16a34a;
      }
      .diff-line.added .diff-line-code {
        color: #166534;
      }
      .diff-line.removed {
        background: #fef2f2;
      }
      .diff-line.removed .diff-prefix {
        color: #dc2626;
      }
      .diff-line.removed .diff-line-code {
        color: #991b1b;
      }
      .diff-line.context {
        background: #fff;
      }
      .spec-layout {
        grid-template-columns: 1fr 240px;
        align-items: start;
        gap: 32px;
        display: grid;
      }
      .spec-rail {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        position: sticky;
        top: 16px;
        overflow: hidden;
      }
      .spec-rail-row {
        border-bottom: 1px solid #e5e7eb;
        padding: 10px 14px;
      }
      .spec-rail-row:last-child {
        border-bottom: none;
      }
      .spec-rail-label {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #9ca3af;
        font-size: 10px;
        font-weight: 700;
        font-family: var(--mate-font-body);
        margin-bottom: 2px;
      }
      .spec-rail-value {
        color: #374151;
        font-size: 13px;
        font-family: var(--mate-font-body);
      }
      .spec-decision {
        border-left: 3px solid var(--mate-primary);
        color: #374151;
        background: #fff7ed;
        border-radius: 0 6px 6px 0;
        margin: 12px 0;
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.6;
      }
      .spec-decision strong {
        color: #111827;
      }
      .swatch-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        display: grid;
      }
      .swatch-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }
      .swatch-color {
        height: 64px;
      }
      .swatch-meta {
        padding: 8px 10px;
      }
      .swatch-name {
        color: #111827;
        font-size: 12px;
        font-weight: 600;
        font-family: var(--mate-font-body);
      }
      .swatch-token {
        color: #9ca3af;
        font-size: 10px;
        font-family: var(--mate-font-mono);
        margin-top: 1px;
      }
      .swatch-hex {
        color: #6b7280;
        font-size: 11px;
        font-family: var(--mate-font-mono);
        margin-top: 2px;
      }
      @keyframes rating {
        0%,
        40% {
          filter: brightness(1.05) contrast(1.05);
          scale: 1.1;
        }
      }
      @keyframes menu {
        0% {
          opacity: 0;
        }
      }
      @keyframes rotator {
        89.9999%,
        to {
          --first-item-position: 0 0%;
        }
        90%,
        99.9999% {
          --first-item-position: 0 calc(var(--items) * 100%);
        }
        to {
          translate: 0 -100%;
        }
      }
      @keyframes progress {
        50% {
          background-position-x: -115%;
        }
      }
      @keyframes radio {
        0% {
          padding: 5px;
        }
        50% {
          padding: 3px;
        }
      }
      @keyframes dropdown {
        0% {
          opacity: 0;
        }
      }
      @keyframes toast {
        0% {
          opacity: 0;
          scale: 0.9;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes skeleton {
        0% {
          background-position: 150%;
        }
        to {
          background-position: -50%;
        }
      }
      @property --tw-border-style {
        syntax: "*";
        inherits: false;

      @property --tw-shadow {
        syntax: "*";
        inherits: false;
        initial-value: 0 0 #0000;
      }
      @property --tw-shadow-color {
        syntax: "*";
        inherits: false;
      }
      @property --tw-shadow-alpha {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 100%;
      }
      @property --tw-inset-shadow {
        syntax: "*";
        inherits: false;
        initial-value: 0 0 #0000;
      }
      @property --tw-inset-shadow-color {
        syntax: "*";
        inherits: false;
      }
      @property --tw-inset-shadow-alpha {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 100%;
      }
      @property --tw-ring-color {
        syntax: "*";
        inherits: false;
      }
      @property --tw-ring-shadow {
        syntax: "*";
        inherits: false;
        initial-value: 0 0 #0000;
      }
      @property --tw-inset-ring-color {
        syntax: "*";
        inherits: false;
      }
      @property --tw-inset-ring-shadow {
        syntax: "*";
        inherits: false;
        initial-value: 0 0 #0000;
      }
      @property --tw-ring-inset {
        syntax: "*";

      @property --tw-ring-offset-width {
        syntax: "<length>";

        initial-value: 0;
      }
      @property --tw-ring-offset-color {
        syntax: "*";

      }
      @property --tw-ring-offset-shadow {
        syntax: "*";
        inherits: false;
        initial-value: 0 0 #0000;
      }
    </style>
  </head>
